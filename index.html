<script>
  // Minimal localStorage-backed shim matching the artifact storage API
  // (get/set/delete/list, all async) so the component code is unchanged.
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem(key);
      if (raw === null) return null;
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      const existed = localStorage.getItem(key) !== null;
      localStorage.removeItem(key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };
</script>

function useIsMobile() {

function timeAgo(input) {
  if (!input) return "—";
  const ts = typeof input === "number" ? input : Date.parse(input);
  if (Number.isNaN(ts)) return "—";
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1) return "just now";
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const day = Math.floor(hr / 24);
  if (day < 30) return `${day}d ago`;
  return new Date(ts).toLocaleDateString();
}

function formatDateTime(input) {
  if (!input) return "—";
  const ts = typeof input === "number" ? input : Date.parse(input);
  if (Number.isNaN(ts)) return "—";
  const d = new Date(ts);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// udm-exchange's UDM_WORKFLOW_PROTOCOL.md §3.2 relay batch header - what
// this whole message schema was originally modeled on, and the format
// design chat / Workbench / udm-exchange already expect a relayed message
// to arrive in. §3's seven verbs map 1:1 onto our `type` field except
// "Info" (this schema's own addition, not in their vocabulary) - kept
// labeled INFO rather than forced into one of theirs.
function formatEDT(input) {
  const ts = typeof input === "number" ? input : Date.parse(input);
  if (Number.isNaN(ts)) return "—";
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false,
  }).formatToParts(new Date(ts));
  const get = (t) => parts.find((p) => p.type === t).value;
  return `${get("year")}-${get("month")}-${get("day")} ${get("hour")}:${get("minute")} EDT`;
}

function formatRelayMessage(data, session) {
  const verb = (data.type || "Info").toUpperCase();
  const sourceIsRon = data.sender === "ron";
  const source = sourceIsRon ? "Ron" : data.sender;
  // Ron's own posts are addressed to the chat they were sent to (this
  // card's topic); a chat's own posts default to Ron, since per §1 every
  // cross-entity relay flows through him - both are just starting points,
  // meant to be hand-edited before actually pasting somewhere.
  const target = sourceIsRon ? session.name : "Ron";
  return `Source: ${source}\nTarget: ${target}\nTimestamp: ${formatEDT(data.timestamp)}\n\n${verb} ${data.message}`;
}

function useRepoStatus(slug) {
  const [state, setState] = useState({ loading: true, error: null, data: null });

    }

  useEffect(() => { fetchStatus(); }, [fetchStatus]);
  return { ...state, refresh: fetchStatus };

// MCP tool results are double-encoded: a JSON-RPC response wraps a
// text content block, whose text is itself a JSON string. The endpoint
// also always responds as a single SSE event (event:/data: lines), not a
// plain JSON body, regardless of the request - both confirmed against a
// real server before writing this, not assumed.
async function callMcpTool(mcpUrl, toolName, args) {
  const res = await fetch(`${mcpUrl}/mcp`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json, text/event-stream" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/call", params: { name: toolName, arguments: args } }),
  });
  if (!res.ok) throw new Error(`MCP server responded ${res.status}`);
  const text = await res.text();
  const dataLine = text.split("\n").find((l) => l.startsWith("data: "));
  if (!dataLine) throw new Error("unexpected MCP response shape (no data: line)");
  const envelope = JSON.parse(dataLine.slice(6));
  if (envelope.error) throw new Error(envelope.error.message || "MCP error");
  const block = envelope.result?.content?.[0];
  if (!block || block.type !== "text") throw new Error("unexpected MCP result shape");
  return JSON.parse(block.text);
}

// Types that expect a reply vs. types that constitute one. A Handoff/Review/Next
// with no later Confirm/Close sharing its correlationId is an unanswered request -
// distinct from refs.status, which is just whatever the sender last reported.
const REQUEST_TYPES = new Set(["Handoff", "Review", "Next"]);
const REPLY_TYPES = new Set(["Confirm", "Close"]);

function useMcpStatus(mcpUrl, topic, enabled = true) {
  const [state, setState] = useState({ loading: true, error: null, data: null });

  const fetchStatus = useCallback(async () => {
    if (!mcpUrl) { setState({ loading: false, error: null, data: null }); return; }
    setState((s) => ({ ...s, loading: true, error: null }));
    try {
      const result = await callMcpTool(mcpUrl, "get_messages", { topic, limit: 1 });
      const msg = result.messages && result.messages[0];
      if (!msg) { setState({ loading: false, error: null, data: null }); return; }
      // refs.status comes back as the raw C# enum member name (e.g. "Blocked"),
      // not pre-lowercased - STATUS_META's keys are lowercase.
      const status = msg.refs && msg.refs.status ? msg.refs.status.toLowerCase() : null;

      let awaitingReply = false;
      if (REQUEST_TYPES.has(msg.type)) {
        if (!msg.correlationId) {
          // Can't verify a reply without a correlation id to check - treat as
          // unanswered rather than silently saying nothing (nudges toward
          // always setting correlationId on request-type messages).
          awaitingReply = true;
        } else {
          // A reply lands on a *different* topic than the request (e.g. a Handoff
          // to agents/claude-pro gets a Confirm on agents/claude-code) - this is
          // deliberately not topic-scoped.
          const thread = await callMcpTool(mcpUrl, "get_messages", { correlationId: msg.correlationId, limit: 50 });
          const hasReply = (thread.messages || []).some((m) => m.id !== msg.id && REPLY_TYPES.has(m.type));
          awaitingReply = !hasReply;
        }
      }

      setState({ loading: false, error: null, data: { status, message: msg.message, sender: msg.sender, timestamp: msg.timestamp, type: msg.type, awaitingReply } });
    } catch (e) {
      setState({ loading: false, error: e.message || "fetch failed", data: null });
    }
  }, [mcpUrl, topic]);

  useEffect(() => {
    if (!enabled) { setState((s) => ({ ...s, loading: false })); return; }
    fetchStatus();
  }, [fetchStatus, enabled]);
  return { ...state, refresh: fetchStatus };
}

// Ron posting to a session is just a send_message call se-ops-board makes
// itself (CORS already allows it) - a Handoff so it shows AWAITING REPLY
// until the session posts anything new on this topic, which naturally
// supersedes it as the latest message. No reply-matching needed: any fresh
// status clears it. This lands on the topic instantly either way - it's
// only the *session noticing* that still needs a wake (see board-ping-routines.md);
// this board has no way to trigger that itself.
const DEFAULT_PING_MESSAGE = "Ron is here — please check in when you can.";
async function sendToSession(mcpUrl, topic, message) {
  return callMcpTool(mcpUrl, "send_message", {
    sender: "ron",
    topic,
    type: "Handoff",
    message: message && message.trim() ? message.trim() : DEFAULT_PING_MESSAGE,
    correlationId: `ron-${Date.now()}`,
  });
}

// Copy-to-clipboard for a message's exact text - mobile has no hover
// tooltip, so a truncated line otherwise has no way to be read or grabbed
// in full. Tap the message (or the AWAITING REPLY badge, same message) to
// expand it and copy it verbatim, whitespace and all.
function useCopyState() {
  return useState("idle"); // idle | copied | error
}
async function copyText(text, setState) {
  try {
    await navigator.clipboard.writeText(text);
    setState("copied");
  } catch (err) {
    setState("error");
  } finally {
    setTimeout(() => setState("idle"), 2000);
  }
}

function McpStatus({ mcpUrl, topic, enabled = true, sessionName }) {
  const { loading, error, data, refresh } = useMcpStatus(mcpUrl, topic, enabled);
  const [sendState, setSendState] = useState("idle"); // idle | sending | sent | error
  const [composeOpen, setComposeOpen] = useState(false);
  const [composeText, setComposeText] = useState("");
  const [msgExpanded, setMsgExpanded] = useState(false);
  const [copyState, setCopyState] = useCopyState();
  if (!mcpUrl) return null;
  if (!enabled) {
    return (
      <div style={{ background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "11px 12px" }}>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: "#5A6468" }}>{topic} · archived, polling paused</span>
      </div>
    );
  }
  const send = async (message) => {
    if (sendState === "sending") return;
    setSendState("sending");
    try {
      await sendToSession(mcpUrl, topic, message);
      setSendState("sent");
      setComposeOpen(false);
      setComposeText("");
      refresh();
    } catch (err) {
      setSendState("error");
    } finally {
      setTimeout(() => setSendState("idle"), 3000);
    }
  };
  const sendLabel = { idle: "📣 Ping", sending: "…", sent: "✓ Sent", error: "✕ Failed" }[sendState];
  const meta = data && data.status && STATUS_META[data.status];
  return (
    <div style={{ background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "11px 12px", display: "flex", flexDirection: "column", gap: 6 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
        <span style={{ color: "#8FBFDA", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{topic}</span>
        <div style={{ display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
          <button onClick={(e) => { e.stopPropagation(); send(); }} disabled={sendState === "sending"} title="Post the default check-in message"
            style={{ background: "none", border: "1px solid #2E3A3F", borderRadius: 5, color: sendState === "error" ? "#D68A78" : sendState === "sent" ? "#5FAE7B" : "#8FBFDA", cursor: sendState === "sending" ? "default" : "pointer", fontSize: 10, letterSpacing: "0.02em", padding: "4px 7px", fontFamily: "'IBM Plex Mono', monospace" }}>{sendLabel}</button>
          <button onClick={(e) => { e.stopPropagation(); setComposeOpen((o) => !o); }} title="Write a custom message to this session"
            style={{ background: composeOpen ? "#1F2A2E" : "none", border: "1px solid #2E3A3F", borderRadius: 5, color: "#8FBFDA", cursor: "pointer", fontSize: 12, padding: "4px 7px", fontFamily: "'IBM Plex Mono', monospace" }}>✎</button>
          <button onClick={(e) => { e.stopPropagation(); refresh(); }} title="Refresh" style={{ background: "none", border: "none", color: "#5A6468", cursor: "pointer", fontSize: 16, padding: "4px 6px", minWidth: 28, minHeight: 28, flexShrink: 0 }}>⟳</button>
        </div>
      </div>
      {composeOpen && (

// Cross-topic activity log for diagnosing traffic between sessions - distinct
// from each card's own McpStatus, which only shows its own topic's latest
// message. get_messages with no topic filter walks every topic on the
// server and returns newest-first (MessageStore.GetAsync, OrderByDescending
// + Take), so this is just that same call with no topic argument.
const TYPE_COLOR = { Handoff: "#E0954D", Confirm: "#5FAE7B", Review: "#8FBFDA", Close: "#5FAE7B", Supersede: "#C1604A", Status: "#8FBFDA", Next: "#E0954D", Info: "#7C878C" };

function useMessageLog(mcpUrl, limit) {
  const [state, setState] = useState({ loading: true, error: null, messages: [] });
  const fetchLog = useCallback(async () => {
    if (!mcpUrl) { setState({ loading: false, error: null, messages: [] }); return; }
    setState((s) => ({ ...s, loading: true, error: null }));
    try {
      const result = await callMcpTool(mcpUrl, "get_messages", { limit });
      setState({ loading: false, error: null, messages: result.messages || [] });
    } catch (e) {
      setState({ loading: false, error: e.message || "fetch failed", messages: [] });
    }
  }, [mcpUrl, limit]);
  useEffect(() => { fetchLog(); }, [fetchLog]);
  return { ...state, refresh: fetchLog };
}

        {msg.refs && msg.refs.status && (
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: STATUS_META[msg.refs.status.toLowerCase()]?.color || "#7C878C" }}>{msg.refs.status.toUpperCase()}</span>
        )}
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: "#5A6468", marginLeft: "auto" }}>{timeAgo(msg.timestamp)}</span>

  );
}

// Top-of-page glanceable summary: for each loaded MCP chat, what's Ron's
// exact next action? Three real states, not just blocked/clear - and all
// three are plain facts already in the data (who sent the latest unanswered
// message), not an AI-inferred guess:
//   - clear: latest message isn't an unanswered request. Nothing to do.
//   - YOUR MOVE: the chat's latest message is an unanswered request FROM
//     the chat (sender isn't "ron") - it's waiting on Ron specifically.
//   - waiting on them: Ron sent the last (still-unanswered) message - the
//     ball is in the chat's court, not Ron's.
// The message text itself is shown too, so "next action" means reading the
// real content, not a paraphrase this page invents.
function PendingRow({ session }) {
  const { loading, error, data } = useMcpStatus(session.mcpUrl, session.topic, true);
  const blocked = !!(data && data.awaitingReply);
  const yourMove = blocked && data && data.sender !== "ron";
  const dotColor = loading ? "#454E52" : error ? "#D68A78" : yourMove ? "#C1604A" : blocked ? "#E0954D" : "#5FAE7B";
  const label = loading ? "checking…" : error ? "error" : yourMove ? "YOUR MOVE" : blocked ? "waiting on them" : "clear";
  const labelColor = yourMove ? "#C1604A" : blocked ? "#E0954D" : "#5A6468";
  return (
    <div onClick={() => scrollToSession(session.id)} title="Jump to this chat's card" style={{ padding: "8px 0", borderTop: "1px solid #1E2629", cursor: "pointer" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
        <Led color={dotColor} glow={yourMove || blocked} size={8} />
        <span style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, color: "#DCE3E5", flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{session.name}</span>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: labelColor, letterSpacing: "0.04em", flexShrink: 0 }}>{label}</span>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#5A6468", flexShrink: 0, minWidth: 118, textAlign: "right" }} title={data ? data.timestamp : ""}>
          {data ? formatDateTime(data.timestamp) : "—"}
        </span>
      </div>
      {data && (
        <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: "#8B959A", marginTop: 3, paddingLeft: 17, display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }} title={data.message}>
          <span style={{ color: "#5A6468" }}>{data.sender}:</span> {data.message}
        </div>
      )}
    </div>
  );
}

// Bounded questions (message-protocol.md §3.2's "qa/{slug}" topic family) -
// distinct from the per-session agents/{name} heartbeat channels above.
// Grouped client-side from the same cross-topic get_messages call MessageLog
// already uses (the server doesn't do prefix filtering), keeping only the
// newest message per qa/ topic and deriving open/closed from whether any
// message on that topic is a Close.
function useQaTopics(mcpUrl) {
  const [state, setState] = useState({ loading: true, error: null, topics: [] });
  const fetchQa = useCallback(async () => {
    if (!mcpUrl) { setState({ loading: false, error: null, topics: [] }); return; }
    setState((s) => ({ ...s, loading: true, error: null }));
    try {
      const result = await callMcpTool(mcpUrl, "get_messages", { limit: 100 });
      const byTopic = new Map();
      for (const m of result.messages || []) {
        if (!m.topic.startsWith("qa/")) continue;
        if (!byTopic.has(m.topic)) byTopic.set(m.topic, []);
        byTopic.get(m.topic).push(m);
      }
      const topics = Array.from(byTopic.entries()).map(([topic, list]) => {
        list.sort((a, b) => Date.parse(b.timestamp) - Date.parse(a.timestamp));
        return { topic, latest: list[0], closed: list.some((m) => m.type === "Close"), count: list.length };
      });
      topics.sort((a, b) => Date.parse(b.latest.timestamp) - Date.parse(a.latest.timestamp));
      setState({ loading: false, error: null, topics });
    } catch (e) {
      setState({ loading: false, error: e.message || "fetch failed", topics: [] });
    }
  }, [mcpUrl]);
  useEffect(() => { fetchQa(); }, [fetchQa]);
  return { ...state, refresh: fetchQa };
}

        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#5A6468", flexShrink: 0 }}>{formatDateTime(latest.timestamp)}</span>
      </div>
      <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: "#8B959A", marginTop: 3, paddingLeft: 17, display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }} title={latest.message}>
        <span style={{ color: "#5A6468" }}>{latest.sender} · {latest.type}:</span> {latest.message}

            {showClosed ? "▴ hide" : "▾ show"} {closed.length} closed

          {showClosed && closed.map((t) => <QaRow key={t.topic} item={t} />)}
        </div>

    </CardShell>
  );
}

function SessionCard({ session, onUpdate, onRemove }) {
  const isMcp = session.kind === "MCP";
  const [notes, setNotes] = useState(session.notes);
  const [repoSlug, setRepoSlug] = useState(session.repoSlug || "");
  const notesDebounce = useRef(null);
  const repoDebounce = useRef(null);

  useEffect(() => setNotes(session.notes), [session.notes]);
  useEffect(() => setRepoSlug(session.repoSlug || ""), [session.repoSlug]);

  const handleNotesChange = (val) => {
    setNotes(val);
    if (notesDebounce.current) clearTimeout(notesDebounce.current);
    notesDebounce.current = setTimeout(() => onUpdate(session.id, { notes: val, updatedAt: Date.now() }), 500);
  };
  const handleRepoChange = (val) => {
    setRepoSlug(val);
    if (repoDebounce.current) clearTimeout(repoDebounce.current);
    repoDebounce.current = setTimeout(() => onUpdate(session.id, { repoSlug: val.trim() }), 600);
  };

  const meta = STATUS_META[session.status];
  const archived = !!session.archived;
  const manualRelay = isMcp && session.relayMode !== "auto";

  return (
    <CardShell dim={archived} id={`session-${session.id}`} background={manualRelay ? MANUAL_RELAY_BG : undefined} borderColor={manualRelay ? MANUAL_RELAY_BORDER : undefined}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: "0.12em", color: "#6FA8C4" }}>{session.kind}</div>
            {archived && <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: "0.08em", color: "#7C878C", border: "1px solid #2E3A3F", borderRadius: 999, padding: "1px 7px" }}>ARCHIVED</div>}
            {manualRelay && !archived && <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: "0.08em", color: "#B7A6E8", border: `1px solid ${MANUAL_RELAY_BORDER}`, borderRadius: 999, padding: "1px 7px" }}>MANUAL RELAY — can't respond on its own</div>}
          </div>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 17, color: archived ? "#8A9297" : "#E7ECEE", lineHeight: 1.25 }}>{session.name}</div>
          <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: "#7C878C", marginTop: 2 }}>{session.subtitle}</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 2, flexShrink: 0 }}>
          {/* MCP-kind cards have no manual override - status reflects whatever the

          <button onClick={() => onUpdate(session.id, { archived: !archived })} title={archived ? "Restore session" : "Archive session"}
            style={{ background: "none", border: "1px solid #232C30", borderRadius: 6, color: "#7C878C", cursor: "pointer", fontSize: 10, letterSpacing: "0.04em", padding: "6px 8px", lineHeight: 1, fontFamily: "'IBM Plex Mono', monospace" }}>
            {archived ? "RESTORE" : "ARCHIVE"}
          </button>

        <McpStatus mcpUrl={session.mcpUrl} topic={session.topic} enabled={!archived} sessionName={session.name} />

        <div>
          <Trace color={meta.color} />

              style={{ width: "100%", boxSizing: "border-box", background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "10px 12px", color: "#B7C1C4", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, outline: "none", marginBottom: 8 }}
              onFocus={(e) => (e.target.style.borderColor = "#6FA8C4")} onBlur={(e) => (e.target.style.borderColor = "#232C30")} />
            <RepoStatus slug={repoSlug.trim()} />

        </div>
      )}
      <div style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#5A6468" }}>
        <span>📄</span>
        {isMcp ? (
          <span>Live via <span style={{ color: "#8FBFDA" }}>get_messages</span> - any agent sends status with <span style={{ color: "#8FBFDA" }}>refs.status</span></span>
        ) : (
          <span>Full status: <span style={{ color: "#8FBFDA" }}>HANDOFF.md</span> in repo root</span>
        )}
      </div>
      <textarea value={notes} onChange={(e) => handleNotesChange(e.target.value)} placeholder="Quick note (see HANDOFF.md for the real handoff)…" rows={2}
        style={{ resize: "vertical", background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "10px 12px", color: "#DCE3E5", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 14, lineHeight: 1.5, outline: "none" }}
        onFocus={(e) => (e.target.style.borderColor = "#6FA8C4")} onBlur={(e) => (e.target.style.borderColor = "#232C30")} />
    </CardShell>
  );
}

function KindToggle({ kind, onChange }) {
  const opt = (value, label) => (
    <button onClick={() => onChange(value)} style={{
      flex: 1, background: kind === value ? "#1F2A2E" : "transparent", border: "1px solid #2E3A3F",
      borderRadius: 6, color: kind === value ? "#E7ECEE" : "#7C878C", fontFamily: "'IBM Plex Mono', monospace",
      fontSize: 11, padding: "7px", cursor: "pointer",
    }}>{label}</button>
  );
  return <div style={{ display: "flex", gap: 6 }}>{opt("CODE", "Coding session")}{opt("MCP", "MCP feed")}</div>;
}

function AddSessionCard({ onAdd }) {
  const [open, setOpen] = useState(false);
  const [kind, setKind] = useState("CODE");
  const [name, setName] = useState("");
  const [repoSlug, setRepoSlug] = useState("");
  const [mcpUrl, setMcpUrl] = useState(KNOWN_MCP_SERVER);
  const [topic, setTopic] = useState("");
  const [relayMode, setRelayMode] = useState("manual");

  const reset = () => { setName(""); setRepoSlug(""); setMcpUrl(KNOWN_MCP_SERVER); setTopic(""); setKind("CODE"); setRelayMode("manual"); setOpen(false); };

  const submit = () => {
    if (!name.trim()) return;
    if (kind === "MCP") {
      if (!mcpUrl.trim() || !topic.trim()) return;
      onAdd({ id: genId("session"), kind: "MCP", name: name.trim(), subtitle: "Live MCP status feed", mcpUrl: mcpUrl.trim(), topic: topic.trim(), status: "idle", notes: "", relayMode });
    } else {
      onAdd({ id: genId("session"), kind: "CODE", name: name.trim(), subtitle: "Claude Code session", repoSlug: repoSlug.trim(), status: "active", notes: "" });
    }
    reset();
  };

  if (!open) {
    return <button onClick={() => setOpen(true)} style={{ background: "#0F1416", border: "1px dashed #2E3A3F", borderRadius: 10, color: "#7C878C", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, padding: "16px", cursor: "pointer", minHeight: 80 }}>+ Add session</button>;
  }

  return (
    <CardShell>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: "0.12em", color: "#6FA8C4" }}>NEW SESSION</div>
      <KindToggle kind={kind} onChange={setKind} />
      <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Session name" autoFocus
        style={{ background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "8px 10px", color: "#E7ECEE", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, outline: "none" }} />
      {kind === "MCP" ? (
        <>
          <input value={mcpUrl} onChange={(e) => setMcpUrl(e.target.value)} placeholder="MCP server URL (e.g. https://your-server.example.com)"
            style={{ background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "8px 10px", color: "#B7C1C4", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, outline: "none" }} />
          <input value={topic} onChange={(e) => setTopic(e.target.value)} placeholder="Topic to poll (e.g. agents/claude-pro)"
            style={{ background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "8px 10px", color: "#B7C1C4", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, outline: "none" }} />
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: "#5A6468" }}>Convention: one topic per session, <code>agents/&#123;name&#125;</code> — must match what that session sends to.</div>
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={() => setRelayMode("manual")} style={{ flex: 1, background: relayMode === "manual" ? MANUAL_RELAY_BG : "transparent", border: `1px solid ${relayMode === "manual" ? MANUAL_RELAY_BORDER : "#2E3A3F"}`, borderRadius: 6, color: relayMode === "manual" ? "#B7A6E8" : "#7C878C", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, padding: "7px", cursor: "pointer" }}>Manual relay</button>
            <button onClick={() => setRelayMode("auto")} style={{ flex: 1, background: relayMode === "auto" ? "#1F2A2E" : "transparent", border: "1px solid #2E3A3F", borderRadius: 6, color: relayMode === "auto" ? "#E7ECEE" : "#7C878C", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, padding: "7px", cursor: "pointer" }}>Auto-wakeable</button>
          </div>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: "#5A6468" }}>Manual relay: a plain chat with no API access (claude.ai chat, ChatGPT) — Ping/compose land on the board but nothing wakes it; you copy/paste by hand. Auto-wakeable: a Claude Code session with a wake Routine already set up.</div>
        </>
      ) : (
        <input value={repoSlug} onChange={(e) => setRepoSlug(e.target.value)} placeholder="owner/repo (optional)"
          style={{ background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "8px 10px", color: "#B7C1C4", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, outline: "none" }} />
      )}
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={submit} style={{ flex: 1, background: "#1B2226", border: "1px solid #2E3A3F", borderRadius: 6, color: "#E7ECEE", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, padding: "8px", cursor: "pointer" }}>Add</button>
        <button onClick={reset} style={{ flex: 1, background: "none", border: "1px solid #232C30", borderRadius: 6, color: "#7C878C", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, padding: "8px", cursor: "pointer" }}>Cancel</button>
      </div>
    </CardShell>
  );
}

function ThreadRow({ thread, onUpdate, onRemove }) {
  const [feeds, setFeeds] = useState(thread.feedsInto);
  const debounceRef = useRef(null);

  useEffect(() => setFeeds(thread.feedsInto), [thread.feedsInto]);

  const handleFeedsChange = (val) => {
    setFeeds(val);
    if (debounceRef.current) clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(() => onUpdate(thread.id, { feedsInto: val }), 500);
  };

  const meta = STATUS_META[thread.status];

  return (
    <div style={{ borderTop: "1px solid #1E2629", padding: "10px 0", display: "flex", flexDirection: "column", gap: 6 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, minWidth: 0 }}>
          <Led color={meta.color} glow={meta.glow} size={6} />
          <span style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, color: thread.archived ? "#7C878C" : "#DCE3E5", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }} title={thread.name}>{thread.name}</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: "#5A6468" }}>{thread.lastActive}</span>
          <StatusPicker compact value={thread.status} onChange={(status) => onUpdate(thread.id, { status })} />
          <button onClick={() => onRemove(thread.id)} title="Remove thread" style={{ background: "none", border: "none", color: "#6B7679", cursor: "pointer", fontSize: 18, padding: "6px 8px", lineHeight: 1, minWidth: 32, minHeight: 32 }}>×</button>
        </div>
      </div>
      <input value={feeds} onChange={(e) => handleFeedsChange(e.target.value)} placeholder="Feeding into… (see sys-eng-status.md)"
        style={{ marginLeft: 4, background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "9px 11px", color: "#B7C1C4", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, outline: "none", width: "calc(100% - 4px)", boxSizing: "border-box" }}
        onFocus={(e) => (e.target.style.borderColor = "#6FA8C4")} onBlur={(e) => (e.target.style.borderColor = "#232C30")} />
    </div>
  );
}

function AddThreadRow({ onAdd }) {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState("");

  const submit = () => {
    if (!name.trim()) return;
    onAdd({ id: genId("thread"), name: name.trim(), lastActive: "new", archived: false, status: "active", feedsInto: "" });
    setName(""); setOpen(false);
  };

  if (!open) {
    return <button onClick={() => setOpen(true)} style={{ marginTop: 10, width: "100%", background: "none", border: "1px dashed #2E3A3F", borderRadius: 6, color: "#7C878C", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, padding: "8px", cursor: "pointer" }}>+ Add thread</button>;
  }

  return (
    <div style={{ marginTop: 10, display: "flex", gap: 6 }}>
      <input value={name} onChange={(e) => setName(e.target.value)} placeholder="New chat name" autoFocus onKeyDown={(e) => e.key === "Enter" && submit()}
        style={{ flex: 1, background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "6px 9px", color: "#E7ECEE", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, outline: "none" }} />
      <button onClick={submit} style={{ background: "#1B2226", border: "1px solid #2E3A3F", borderRadius: 6, color: "#E7ECEE", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, padding: "0 12px", cursor: "pointer" }}>Add</button>
    </div>
  );
}

function ProjectCard({ threads, onUpdateThread, onAddThread, onRemoveThread }) {
  const [expanded, setExpanded] = useState(false);
  const activeCount = threads.filter((t) => !t.archived).length;

  return (
    <CardShell>
      <div onClick={() => setExpanded((e) => !e)} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8, cursor: "pointer" }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: "0.12em", color: "#6FA8C4", marginBottom: 4 }}>PROJECT</div>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 17, color: "#E7ECEE", lineHeight: 1.25 }}>Sys Eng Approach</div>
          <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: "#7C878C", marginTop: 2 }}>{activeCount} live thread{activeCount === 1 ? "" : "s"} · {threads.length} total</div>
        </div>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#8FBFDA", padding: "4px 9px", border: "1px solid #2E3A3F", borderRadius: 999, background: "#1B2226", flexShrink: 0 }}>{expanded ? "COLLAPSE ▴" : "THREADS ▾"}</span>
      </div>
      <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: "#7C878C" }}>
        Parallel chats that inform the two coding sessions.
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#5A6468" }}>
        <span>📄</span>
        <span>Full status: <span style={{ color: "#8FBFDA" }}>sys-eng-status.md</span> in Project knowledge</span>
      </div>
      {expanded && (
        <div style={{ marginTop: 2 }}>
          {threads.map((t) => <ThreadRow key={t.id} thread={t} onUpdate={onUpdateThread} onRemove={onRemoveThread} />)}
          <AddThreadRow onAdd={onAddThread} />
        </div>
      )}
    </CardShell>
  );
}

function OpsBoard() {
  const isMobile = useIsMobile();
  const [sessions, setSessions] = useState(DEFAULT_SESSIONS);
  const [threads, setThreads] = useState(DEFAULT_THREADS);
  const [loaded, setLoaded] = useState(false);
  const [saveError, setSaveError] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const result = await window.storage.get(STORAGE_KEY);
        if (result && result.value) {
          const parsed = JSON.parse(result.value);
          if (Array.isArray(parsed.sessions) && parsed.sessions.length) setSessions(parsed.sessions);
          if (Array.isArray(parsed.threads) && parsed.threads.length) setThreads(parsed.threads);
        }
      } catch (e) {} finally { setLoaded(true); }
    })();
  }, []);

  const persist = useCallback(async (nextSessions, nextThreads) => {
    try {
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify({ sessions: nextSessions, threads: nextThreads }));
      setSaveError(!result);
    } catch (e) { setSaveError(true); }
  }, []);

  const updateSession = useCallback((id, patch) => {
    setSessions((prev) => { const next = prev.map((s) => (s.id === id ? { ...s, ...patch } : s)); persist(next, threads); return next; });
  }, [persist, threads]);

  const addSession = useCallback((session) => {
    setSessions((prev) => { const next = [...prev, session]; persist(next, threads); return next; });
  }, [persist, threads]);

  const removeSession = useCallback((id) => {
    setSessions((prev) => { const next = prev.filter((s) => s.id !== id); persist(next, threads); return next; });
  }, [persist, threads]);

  const updateThread = useCallback((id, patch) => {
    setThreads((prev) => { const next = prev.map((t) => (t.id === id ? { ...t, ...patch } : t)); persist(sessions, next); return next; });
  }, [persist, sessions]);

  const addThread = useCallback((thread) => {
    setThreads((prev) => { const next = [thread, ...prev]; persist(sessions, next); return next; });
  }, [persist, sessions]);

  const removeThread = useCallback((id) => {
    setThreads((prev) => { const next = prev.filter((t) => t.id !== id); persist(sessions, next); return next; });
  }, [persist, sessions]);

  if (!loaded) {
    return <div style={{ minHeight: "100vh", background: "#0D1113", display: "flex", alignItems: "center", justifyContent: "center", color: "#6B7679", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12 }}>loading board…</div>;
  }

  return (
    <div style={{ minHeight: "100vh", background: "#0D1113", color: "#E7ECEE", padding: "20px 16px 40px" }}>
      <div style={{ maxWidth: 720, margin: "0 auto" }}>
        <header style={{ marginBottom: 20 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: "0.16em", color: "#6FA8C4", marginBottom: 6 }}>SETR SESSION BOARD</div>
          <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 24, margin: 0, lineHeight: 1.15 }}>Coordination Console</h1>
          <p style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, color: "#7C878C", marginTop: 6, maxWidth: 480 }}>
            Repo status pulls live from GitHub's public commit history. Threads and notes are your own log, saved to this device's browser storage.
          </p>
          {saveError && <div style={{ marginTop: 10, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#C1604A" }}>Save failed — changes may not persist. Try again.</div>}
          <div style={{ marginTop: 8, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#5A6468" }}>
            {sessions.filter((s) => !s.archived).length} active session{sessions.filter((s) => !s.archived).length === 1 ? "" : "s"} · {sessions.filter((s) => s.archived).length} archived · {sessions.length} total
          </div>
        </header>
        <div style={{ display: "flex", flexDirection: "column", gap: isMobile ? 14 : 12, marginBottom: isMobile ? 14 : 12 }}>
          <PendingSummary sessions={sessions} />
          <OpenQaList mcpUrl={KNOWN_MCP_SERVER} />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(auto-fit, minmax(260px, 1fr))", gap: isMobile ? 14 : 12 }}>
          <ProjectCard threads={threads} onUpdateThread={updateThread} onAddThread={addThread} onRemoveThread={removeThread} />
          <MessageLog mcpUrl={KNOWN_MCP_SERVER} />
          {[...sessions].sort((a, b) => (a.archived ? 1 : 0) - (b.archived ? 1 : 0)).map((s) => <SessionCard key={s.id} session={s} onUpdate={updateSession} onRemove={removeSession} />)}
          <AddSessionCard onAdd={addSession} />
        </div>
      </div>
    </div>
  );
}

root.render(React.createElement(OpsBoard));
