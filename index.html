<script>
  // Minimal localStorage-backed shim matching the artifact storage API
  // (get/set/delete/list, all async) so the component code is unchanged.
  window.storage = {
    async get(key) {
      const raw = localStorage.getItem(key);
      if (raw === null) return null;
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      const existed = localStorage.getItem(key) !== null;
      localStorage.removeItem(key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };
</script>

const STATUS_META = {

function useIsMobile() {
  const [isMobile, setIsMobile] = useState(
    () => typeof window !== "undefined" && window.innerWidth <= 640
  );
  useEffect(() => {
    function onResize() {
      setIsMobile(window.innerWidth <= 640);
    }
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  return isMobile;
}

function timeAgo(input) {
  if (!input) return "—";
  const ts = typeof input === "number" ? input : Date.parse(input);
  if (Number.isNaN(ts)) return "—";
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1) return "just now";
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const day = Math.floor(hr / 24);
  if (day < 30) return `${day}d ago`;
  return new Date(ts).toLocaleDateString();
}

function genId(prefix) {
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
}

function Led({ color, glow, size = 8 }) {
  return React.createElement("span", {
    style: { width: size, height: size, borderRadius: "50%", background: color, boxShadow: glow ? `0 0 8px ${color}` : "none", display: "inline-block", flexShrink: 0 },

function CardShell({ children }) {
  return <div style={{ background: "#131A1D", border: "1px solid #232C30", borderRadius: 10, padding: "18px 16px 16px", display: "flex", flexDirection: "column", gap: 14, minWidth: 0 }}>{children}</div>;
}

function useRepoStatus(slug) {
  const [state, setState] = useState({ loading: true, error: null, data: null });

  const fetchStatus = useCallback(async () => {
    if (!slug || !slug.includes("/")) { setState({ loading: false, error: null, data: null }); return; }
    setState((s) => ({ ...s, loading: true, error: null }));
    try {
      const res = await fetch(`https://api.github.com/repos/${slug}/commits?per_page=1`);
      if (!res.ok) throw new Error(res.status === 404 ? "repo not found or private" : `GitHub responded ${res.status}`);
      const json = await res.json();
      const c = json[0];
      if (!c) throw new Error("no commits found");
      setState({ loading: false, error: null, data: { message: c.commit.message.split("\n")[0], author: c.commit.author?.name || "unknown", date: c.commit.author?.date, sha: c.sha.slice(0, 7), url: c.html_url } });
    } catch (e) {
      setState({ loading: false, error: e.message || "fetch failed", data: null });
    }
  }, [slug]);

  useEffect(() => { fetchStatus(); }, [fetchStatus]);
  return { ...state, refresh: fetchStatus };
}

function RepoStatus({ slug }) {
  const { loading, error, data, refresh } = useRepoStatus(slug);
  if (!slug) return null;
  return (
    <div style={{ background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "11px 12px", display: "flex", flexDirection: "column", gap: 6 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
        <a href={`https://github.com/${slug}`} target="_blank" rel="noopener noreferrer" style={{ color: "#8FBFDA", textDecoration: "none", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{slug} ↗</a>
        <button onClick={(e) => { e.stopPropagation(); refresh(); }} title="Refresh" style={{ background: "none", border: "none", color: "#5A6468", cursor: "pointer", fontSize: 16, padding: "4px 6px", minWidth: 28, minHeight: 28, flexShrink: 0 }}>⟳</button>
      </div>
      {loading && <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#5A6468" }}>checking…</div>}
      {!loading && error && (
        <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: "#D68A78", lineHeight: 1.45 }}>
          {error}. Tap the link above to check on GitHub directly.
        </div>
      )}
      {!loading && data && (
        <a href={data.url} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none", color: "inherit" }}>
          <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, color: "#B7C1C4", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={data.message}>{data.message}</div>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#5A6468", marginTop: 2 }}>{data.sha} · {data.author} · {timeAgo(data.date)}</div>
        </a>
      )}
    </div>
  );
}

// MCP tool results are double-encoded: a JSON-RPC response wraps a
// text content block, whose text is itself a JSON string. The endpoint
// also always responds as a single SSE event (event:/data: lines), not a
// plain JSON body, regardless of the request - both confirmed against a
// real server before writing this, not assumed.
async function callMcpTool(mcpUrl, toolName, args) {
  const res = await fetch(`${mcpUrl}/mcp`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json, text/event-stream" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/call", params: { name: toolName, arguments: args } }),
  });
  if (!res.ok) throw new Error(`MCP server responded ${res.status}`);
  const text = await res.text();
  const dataLine = text.split("\n").find((l) => l.startsWith("data: "));
  if (!dataLine) throw new Error("unexpected MCP response shape (no data: line)");
  const envelope = JSON.parse(dataLine.slice(6));
  if (envelope.error) throw new Error(envelope.error.message || "MCP error");
  const block = envelope.result?.content?.[0];
  if (!block || block.type !== "text") throw new Error("unexpected MCP result shape");
  return JSON.parse(block.text);
}

// Types that expect a reply vs. types that constitute one. A Handoff/Review/Next
// with no later Confirm/Close sharing its correlationId is an unanswered request -
// distinct from refs.status, which is just whatever the sender last reported.
const REQUEST_TYPES = new Set(["Handoff", "Review", "Next"]);
const REPLY_TYPES = new Set(["Confirm", "Close"]);

function useMcpStatus(mcpUrl, topic) {
  const [state, setState] = useState({ loading: true, error: null, data: null });

  const fetchStatus = useCallback(async () => {
    if (!mcpUrl) { setState({ loading: false, error: null, data: null }); return; }
    setState((s) => ({ ...s, loading: true, error: null }));
    try {
      const result = await callMcpTool(mcpUrl, "get_messages", { topic, limit: 1 });
      const msg = result.messages && result.messages[0];
      if (!msg) { setState({ loading: false, error: null, data: null }); return; }
      // refs.status comes back as the raw C# enum member name (e.g. "Blocked"),
      // not pre-lowercased - STATUS_META's keys are lowercase.
      const status = msg.refs && msg.refs.status ? msg.refs.status.toLowerCase() : null;

      let awaitingReply = false;
      if (REQUEST_TYPES.has(msg.type)) {
        if (!msg.correlationId) {
          // Can't verify a reply without a correlation id to check - treat as
          // unanswered rather than silently saying nothing (nudges toward
          // always setting correlationId on request-type messages).
          awaitingReply = true;
        } else {
          // A reply lands on a *different* topic than the request (e.g. a Handoff
          // to agents/claude-pro gets a Confirm on agents/claude-code) - this is
          // deliberately not topic-scoped.
          const thread = await callMcpTool(mcpUrl, "get_messages", { correlationId: msg.correlationId, limit: 50 });
          const hasReply = (thread.messages || []).some((m) => m.id !== msg.id && REPLY_TYPES.has(m.type));
          awaitingReply = !hasReply;
        }
      }

      setState({ loading: false, error: null, data: { status, message: msg.message, sender: msg.sender, timestamp: msg.timestamp, type: msg.type, awaitingReply } });
    } catch (e) {
      setState({ loading: false, error: e.message || "fetch failed", data: null });
    }
  }, [mcpUrl, topic]);

  useEffect(() => { fetchStatus(); }, [fetchStatus]);
  return { ...state, refresh: fetchStatus };
}

function McpStatus({ mcpUrl, topic }) {
  const { loading, error, data, refresh } = useMcpStatus(mcpUrl, topic);
  if (!mcpUrl) return null;
  const meta = data && data.status && STATUS_META[data.status];
  return (
    <div style={{ background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "11px 12px", display: "flex", flexDirection: "column", gap: 6 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
        <span style={{ color: "#8FBFDA", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{topic}</span>
        <button onClick={(e) => { e.stopPropagation(); refresh(); }} title="Refresh" style={{ background: "none", border: "none", color: "#5A6468", cursor: "pointer", fontSize: 16, padding: "4px 6px", minWidth: 28, minHeight: 28, flexShrink: 0 }}>⟳</button>
      </div>
      {loading && <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#5A6468" }}>checking…</div>}
      {!loading && error && (
        <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: "#D68A78", lineHeight: 1.45 }}>{error}</div>
      )}
      {!loading && !error && !data && (
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#5A6468" }}>no status messages yet</div>
      )}
      {!loading && data && (
        <div>
          {/* Distinct axis from refs.status - an unanswered request, not a self-reported
              status. Shown above the status line since it's the more urgent thing to notice. */}
          {data.awaitingReply && (
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6, background: "#2A1E14", border: "1px solid #4A3420", borderRadius: 5, padding: "5px 8px" }}>
              <Led color="#E0954D" glow size={7} />
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#E0954D", letterSpacing: "0.03em" }}>AWAITING REPLY · {data.type.toUpperCase()}</span>
            </div>
          )}
          {meta && (
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
              <Led color={meta.color} glow={meta.glow} size={7} />
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: meta.color }}>{meta.label.toUpperCase()}</span>
            </div>
          )}
          <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, color: "#B7C1C4", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={data.message}>{data.message}</div>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#5A6468", marginTop: 2 }}>{data.sender} · {timeAgo(data.timestamp)}</div>
        </div>
      )}
    </div>
  );
}

function SessionCard({ session, onUpdate, onRemove }) {
  const isMcp = session.kind === "MCP";
  const [notes, setNotes] = useState(session.notes);
  const [repoSlug, setRepoSlug] = useState(session.repoSlug || "");
  const notesDebounce = useRef(null);
  const repoDebounce = useRef(null);

  useEffect(() => setNotes(session.notes), [session.notes]);
  useEffect(() => setRepoSlug(session.repoSlug || ""), [session.repoSlug]);

  const handleNotesChange = (val) => {
    setNotes(val);
    if (notesDebounce.current) clearTimeout(notesDebounce.current);
    notesDebounce.current = setTimeout(() => onUpdate(session.id, { notes: val, updatedAt: Date.now() }), 500);
  };
  const handleRepoChange = (val) => {
    setRepoSlug(val);
    if (repoDebounce.current) clearTimeout(repoDebounce.current);
    repoDebounce.current = setTimeout(() => onUpdate(session.id, { repoSlug: val.trim() }), 600);
  };

  const meta = STATUS_META[session.status];

  return (
    <CardShell>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: "0.12em", color: "#6FA8C4", marginBottom: 4 }}>{session.kind}</div>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 17, color: "#E7ECEE", lineHeight: 1.25 }}>{session.name}</div>
          <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: "#7C878C", marginTop: 2 }}>{session.subtitle}</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
          {/* MCP-kind cards have no manual override - status reflects whatever the
              connected agent last reported via refs.status, not a human's dropdown pick. */}
          {!isMcp && <StatusPicker value={session.status} onChange={(status) => onUpdate(session.id, { status, updatedAt: Date.now() })} />}
          {onRemove && <button onClick={() => onRemove(session.id)} title="Remove session" style={{ background: "none", border: "none", color: "#6B7679", cursor: "pointer", fontSize: 20, padding: "6px 8px", lineHeight: 1, minWidth: 32, minHeight: 32 }}>×</button>}
        </div>
      </div>
      {isMcp ? (
        <McpStatus mcpUrl={session.mcpUrl} topic={session.topic} />
      ) : (
        <div>
          <Trace color={meta.color} />
          <div style={{ marginTop: 8 }}>
            <input value={repoSlug} onChange={(e) => handleRepoChange(e.target.value)} placeholder="owner/repo"
              style={{ width: "100%", boxSizing: "border-box", background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "10px 12px", color: "#B7C1C4", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, outline: "none", marginBottom: 8 }}
              onFocus={(e) => (e.target.style.borderColor = "#6FA8C4")} onBlur={(e) => (e.target.style.borderColor = "#232C30")} />
            <RepoStatus slug={repoSlug.trim()} />
          </div>
        </div>
      )}
      <div style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#5A6468" }}>
        <span>📄</span>
        {isMcp ? (
          <span>Live via <span style={{ color: "#8FBFDA" }}>get_messages</span> - any agent sends status with <span style={{ color: "#8FBFDA" }}>refs.status</span></span>
        ) : (
          <span>Full status: <span style={{ color: "#8FBFDA" }}>HANDOFF.md</span> in repo root</span>
        )}
      </div>
      <textarea value={notes} onChange={(e) => handleNotesChange(e.target.value)} placeholder="Quick note (see HANDOFF.md for the real handoff)…" rows={2}
        style={{ resize: "vertical", background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "10px 12px", color: "#DCE3E5", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 14, lineHeight: 1.5, outline: "none" }}
        onFocus={(e) => (e.target.style.borderColor = "#6FA8C4")} onBlur={(e) => (e.target.style.borderColor = "#232C30")} />
    </CardShell>
  );
}

function KindToggle({ kind, onChange }) {
  const opt = (value, label) => (
    <button onClick={() => onChange(value)} style={{
      flex: 1, background: kind === value ? "#1F2A2E" : "transparent", border: "1px solid #2E3A3F",
      borderRadius: 6, color: kind === value ? "#E7ECEE" : "#7C878C", fontFamily: "'IBM Plex Mono', monospace",
      fontSize: 11, padding: "7px", cursor: "pointer",
    }}>{label}</button>
  );
  return <div style={{ display: "flex", gap: 6 }}>{opt("CODE", "Coding session")}{opt("MCP", "MCP feed")}</div>;
}

function AddSessionCard({ onAdd }) {
  const [open, setOpen] = useState(false);
  const [kind, setKind] = useState("CODE");
  const [name, setName] = useState("");
  const [repoSlug, setRepoSlug] = useState("");
  const [mcpUrl, setMcpUrl] = useState("");
  const [topic, setTopic] = useState("");

  const reset = () => { setName(""); setRepoSlug(""); setMcpUrl(""); setTopic(""); setKind("CODE"); setOpen(false); };

  const submit = () => {
    if (!name.trim()) return;
    if (kind === "MCP") {
      if (!mcpUrl.trim() || !topic.trim()) return;
      onAdd({ id: genId("session"), kind: "MCP", name: name.trim(), subtitle: "Live MCP status feed", mcpUrl: mcpUrl.trim(), topic: topic.trim(), status: "idle", notes: "" });
    } else {
      onAdd({ id: genId("session"), kind: "CODE", name: name.trim(), subtitle: "Claude Code session", repoSlug: repoSlug.trim(), status: "active", notes: "" });
    }
    reset();
  };

  if (!open) {
    return <button onClick={() => setOpen(true)} style={{ background: "#0F1416", border: "1px dashed #2E3A3F", borderRadius: 10, color: "#7C878C", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, padding: "16px", cursor: "pointer", minHeight: 80 }}>+ Add session</button>;
  }

  return (
    <CardShell>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: "0.12em", color: "#6FA8C4" }}>NEW SESSION</div>
      <KindToggle kind={kind} onChange={setKind} />
      <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Session name" autoFocus
        style={{ background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "8px 10px", color: "#E7ECEE", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, outline: "none" }} />
      {kind === "MCP" ? (
        <>
          <input value={mcpUrl} onChange={(e) => setMcpUrl(e.target.value)} placeholder="MCP server URL (e.g. https://your-server.example.com)"
            style={{ background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "8px 10px", color: "#B7C1C4", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, outline: "none" }} />
          <input value={topic} onChange={(e) => setTopic(e.target.value)} placeholder="Topic to poll (e.g. agents/claude-pro)"
            style={{ background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "8px 10px", color: "#B7C1C4", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, outline: "none" }} />
        </>
      ) : (
        <input value={repoSlug} onChange={(e) => setRepoSlug(e.target.value)} placeholder="owner/repo (optional)"
          style={{ background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "8px 10px", color: "#B7C1C4", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, outline: "none" }} />
      )}
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={submit} style={{ flex: 1, background: "#1B2226", border: "1px solid #2E3A3F", borderRadius: 6, color: "#E7ECEE", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, padding: "8px", cursor: "pointer" }}>Add</button>
        <button onClick={reset} style={{ flex: 1, background: "none", border: "1px solid #232C30", borderRadius: 6, color: "#7C878C", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, padding: "8px", cursor: "pointer" }}>Cancel</button>
      </div>
    </CardShell>
  );
}

function ThreadRow({ thread, onUpdate, onRemove }) {
  const [feeds, setFeeds] = useState(thread.feedsInto);
  const debounceRef = useRef(null);

  useEffect(() => setFeeds(thread.feedsInto), [thread.feedsInto]);

  const handleFeedsChange = (val) => {
    setFeeds(val);
    if (debounceRef.current) clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(() => onUpdate(thread.id, { feedsInto: val }), 500);
  };

  const meta = STATUS_META[thread.status];

  return (
    <div style={{ borderTop: "1px solid #1E2629", padding: "10px 0", display: "flex", flexDirection: "column", gap: 6 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, minWidth: 0 }}>
          <Led color={meta.color} glow={meta.glow} size={6} />
          <span style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, color: thread.archived ? "#7C878C" : "#DCE3E5", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }} title={thread.name}>{thread.name}</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: "#5A6468" }}>{thread.lastActive}</span>
          <StatusPicker compact value={thread.status} onChange={(status) => onUpdate(thread.id, { status })} />
          <button onClick={() => onRemove(thread.id)} title="Remove thread" style={{ background: "none", border: "none", color: "#6B7679", cursor: "pointer", fontSize: 18, padding: "6px 8px", lineHeight: 1, minWidth: 32, minHeight: 32 }}>×</button>
        </div>
      </div>
      <input value={feeds} onChange={(e) => handleFeedsChange(e.target.value)} placeholder="Feeding into… (see sys-eng-status.md)"
        style={{ marginLeft: 4, background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "9px 11px", color: "#B7C1C4", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, outline: "none", width: "calc(100% - 4px)", boxSizing: "border-box" }}
        onFocus={(e) => (e.target.style.borderColor = "#6FA8C4")} onBlur={(e) => (e.target.style.borderColor = "#232C30")} />
    </div>
  );
}

function AddThreadRow({ onAdd }) {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState("");

  const submit = () => {
    if (!name.trim()) return;
    onAdd({ id: genId("thread"), name: name.trim(), lastActive: "new", archived: false, status: "active", feedsInto: "" });
    setName(""); setOpen(false);
  };

  if (!open) {
    return <button onClick={() => setOpen(true)} style={{ marginTop: 10, width: "100%", background: "none", border: "1px dashed #2E3A3F", borderRadius: 6, color: "#7C878C", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, padding: "8px", cursor: "pointer" }}>+ Add thread</button>;
  }

  return (
    <div style={{ marginTop: 10, display: "flex", gap: 6 }}>
      <input value={name} onChange={(e) => setName(e.target.value)} placeholder="New chat name" autoFocus onKeyDown={(e) => e.key === "Enter" && submit()}
        style={{ flex: 1, background: "#0F1416", border: "1px solid #232C30", borderRadius: 6, padding: "6px 9px", color: "#E7ECEE", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, outline: "none" }} />
      <button onClick={submit} style={{ background: "#1B2226", border: "1px solid #2E3A3F", borderRadius: 6, color: "#E7ECEE", fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, padding: "0 12px", cursor: "pointer" }}>Add</button>
    </div>
  );
}

function ProjectCard({ threads, onUpdateThread, onAddThread, onRemoveThread }) {
  const [expanded, setExpanded] = useState(false);
  const activeCount = threads.filter((t) => !t.archived).length;

  return (
    <CardShell>
      <div onClick={() => setExpanded((e) => !e)} style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8, cursor: "pointer" }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: "0.12em", color: "#6FA8C4", marginBottom: 4 }}>PROJECT</div>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 17, color: "#E7ECEE", lineHeight: 1.25 }}>Sys Eng Approach</div>
          <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: "#7C878C", marginTop: 2 }}>{activeCount} live thread{activeCount === 1 ? "" : "s"} · {threads.length} total</div>
        </div>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#8FBFDA", padding: "4px 9px", border: "1px solid #2E3A3F", borderRadius: 999, background: "#1B2226", flexShrink: 0 }}>{expanded ? "COLLAPSE ▴" : "THREADS ▾"}</span>
      </div>
      <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: "#7C878C" }}>
        Parallel chats that inform the two coding sessions.
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#5A6468" }}>
        <span>📄</span>
        <span>Full status: <span style={{ color: "#8FBFDA" }}>sys-eng-status.md</span> in Project knowledge</span>
      </div>
      {expanded && (
        <div style={{ marginTop: 2 }}>
          {threads.map((t) => <ThreadRow key={t.id} thread={t} onUpdate={onUpdateThread} onRemove={onRemoveThread} />)}
          <AddThreadRow onAdd={onAddThread} />
        </div>
      )}
    </CardShell>
  );
}

function OpsBoard() {
  const isMobile = useIsMobile();
  const [sessions, setSessions] = useState(DEFAULT_SESSIONS);
  const [threads, setThreads] = useState(DEFAULT_THREADS);
  const [loaded, setLoaded] = useState(false);
  const [saveError, setSaveError] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const result = await window.storage.get(STORAGE_KEY);
        if (result && result.value) {
          const parsed = JSON.parse(result.value);
          if (Array.isArray(parsed.sessions) && parsed.sessions.length) setSessions(parsed.sessions);
          if (Array.isArray(parsed.threads) && parsed.threads.length) setThreads(parsed.threads);
        }
      } catch (e) {} finally { setLoaded(true); }
    })();
  }, []);

  const persist = useCallback(async (nextSessions, nextThreads) => {
    try {
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify({ sessions: nextSessions, threads: nextThreads }));
      setSaveError(!result);
    } catch (e) { setSaveError(true); }
  }, []);

  const updateSession = useCallback((id, patch) => {
    setSessions((prev) => { const next = prev.map((s) => (s.id === id ? { ...s, ...patch } : s)); persist(next, threads); return next; });
  }, [persist, threads]);

  const addSession = useCallback((session) => {
    setSessions((prev) => { const next = [...prev, session]; persist(next, threads); return next; });
  }, [persist, threads]);

  const removeSession = useCallback((id) => {
    setSessions((prev) => { const next = prev.filter((s) => s.id !== id); persist(next, threads); return next; });
  }, [persist, threads]);

  const updateThread = useCallback((id, patch) => {
    setThreads((prev) => { const next = prev.map((t) => (t.id === id ? { ...t, ...patch } : t)); persist(sessions, next); return next; });
  }, [persist, sessions]);

  const addThread = useCallback((thread) => {
    setThreads((prev) => { const next = [thread, ...prev]; persist(sessions, next); return next; });
  }, [persist, sessions]);

  const removeThread = useCallback((id) => {
    setThreads((prev) => { const next = prev.filter((t) => t.id !== id); persist(sessions, next); return next; });
  }, [persist, sessions]);

  if (!loaded) {
    return <div style={{ minHeight: "100vh", background: "#0D1113", display: "flex", alignItems: "center", justifyContent: "center", color: "#6B7679", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12 }}>loading board…</div>;
  }

  return (
    <div style={{ minHeight: "100vh", background: "#0D1113", color: "#E7ECEE", padding: "20px 16px 40px" }}>
      <div style={{ maxWidth: 720, margin: "0 auto" }}>
        <header style={{ marginBottom: 20 }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: "0.16em", color: "#6FA8C4", marginBottom: 6 }}>SETR SESSION BOARD</div>
          <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 24, margin: 0, lineHeight: 1.15 }}>Coordination Console</h1>
          <p style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, color: "#7C878C", marginTop: 6, maxWidth: 480 }}>
            Repo status pulls live from GitHub's public commit history. Threads and notes are your own log, saved to this device's browser storage.
          </p>
          {saveError && <div style={{ marginTop: 10, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#C1604A" }}>Save failed — changes may not persist. Try again.</div>}
        </header>
        <div style={{ display: "grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(auto-fit, minmax(260px, 1fr))", gap: isMobile ? 14 : 12 }}>
          <ProjectCard threads={threads} onUpdateThread={updateThread} onAddThread={addThread} onRemoveThread={removeThread} />
          {sessions.map((s) => <SessionCard key={s.id} session={s} onUpdate={updateSession} onRemove={removeSession} />)}
          <AddSessionCard onAdd={addSession} />
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(OpsBoard));
</script>
